<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>收藏备注</title>
<style>
  html, body { margin: 0; background: transparent; }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; color: #0f1419; }
  .card { position: absolute; inset: 6px; box-sizing: border-box; background: #fff; border: 1px solid #cfd9de; border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.2); padding: 12px 14px 10px; display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .title { font-weight: 700; }
  .close { margin-left: auto; border: 0; background: none; color: #536471; font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
  .close:hover { background: #eff3f4; }
  .tweet { font-size: 12.5px; color: #536471; background: #f7f9f9; border-radius: 8px; padding: 5px 8px; margin-bottom: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .tweet b { color: #0f1419; font-weight: 600; }
  textarea { flex: 1; width: 100%; box-sizing: border-box; min-height: 60px; resize: none; border: 1px solid #cfd9de; border-radius: 10px;
    padding: 8px 10px; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: #0f1419; outline: none; }
  textarea:focus { border-color: #1d9bf0; box-shadow: 0 0 0 3px rgba(29,155,240,.18); }
  .msg { font-size: 12.5px; margin-top: 5px; color: #b54708; }
  .msg:empty { display: none; }
  .msg.ok { color: #067d3d; }
  .foot { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: #536471; }
  .grow { flex: 1; }
  .save { border: 0; background: #0f1419; color: #fff; border-radius: 999px; padding: 5px 14px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .save:disabled { opacity: .45; cursor: default; }
  .go { display: flex; align-items: center; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #eff3f4; font-size: 12.5px; color: #536471; }
  .go b { color: #0f1419; }
  .tool { border: 1px solid #cfd9de; background: #fff; color: #0f1419; border-radius: 999px; padding: 3px 10px; font-weight: 700; font-size: 12.5px; cursor: pointer; }
  .tool:hover { background: #eff3f4; }
  .tool:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<div class="card" role="dialog" aria-label="收藏备注">
  <div class="head"><span class="title">写一句为什么收藏</span><button class="close" type="button" aria-label="收起" title="收起（写了的字留作草稿）">×</button></div>
  <div class="tweet" id="tweet"></div>
  <textarea id="text" maxlength="4000" placeholder="为什么存？打算怎么用？"></textarea>
  <div class="msg" id="msg"></div>
  <div class="foot"><span>回车保存 · Shift+回车换行 · Esc 收起</span><span class="grow"></span><button class="save" id="save" type="button">保存</button></div>
  <div class="go"><b>马上做</b><span class="grow"></span><button class="tool" type="button" data-tool="claude" title="在 Claude 桌面端开一个 Claude Code 新对话，开场白带上备注和原文">用 Claude</button><button class="tool" type="button" data-tool="codex" title="在 Codex 桌面端开一个新对话，开场白带上备注和原文">用 Codex</button><button class="tool" type="button" data-tool="copy" title="把备注和原文复制下来，贴给任何 AI">复制</button></div>
</div>
<script src="card.js"></script>
</body>
</html>
